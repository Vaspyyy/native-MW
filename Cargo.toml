[workspace]
members = [
    "crates/mw-core",
    "crates/mw-native",
    "crates/mw-tools",
]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.96"

[workspace.dependencies]
ab_glyph = "0.2.32"
anyhow = "1.0.104"
base64 = "0.23.1"
bytemuck = { version = "1.25.2", features = ["derive"] }
env_logger = "0.11.10"
flate2 = "1.1.9"
futures-lite = "2.6.1"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "webp"] }
log = "0.4.33"
rayon = "1.12.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["float_roundtrip"] }
thiserror = "2.0.20"
wgpu = "29.0.4"
winit = "0.30.13"

[profile.release]
codegen-units = 1
lto = "thin"
